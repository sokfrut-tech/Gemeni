name: Jarvis Auto Repair Loop

on:
  workflow_run:
    workflows: ["Jarvis Test Factory", "Build Jarvis"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: jarvis-auto-repair
  cancel-in-progress: false

jobs:
  dispatch-repairs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch dispatcher code only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Collect failure context
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repair-evidence
          gh run view "${RUN_ID:-0}" --repo "$REPO" --log-failed > repair-evidence/failed.log 2>&1 || true
          printf '%s\n' "tested_sha=${{ github.event.workflow_run.head_sha || github.sha }}" > repair-evidence/context.txt
          printf '%s\n' "source_run=${RUN_ID:-manual}" >> repair-evidence/context.txt

      - name: Classify failures
        run: |
          python tools/technician/test_loop_dispatcher.py \
            --input repair-evidence/failed.log \
            --output repair-evidence/repair-queue.json || true
          test -f repair-evidence/repair-queue.json || printf '%s\n' '{"items":[]}' > repair-evidence/repair-queue.json

      - name: Create repair issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          p='repair-evidence/repair-queue.json'
          data=json.load(open(p, encoding='utf-8'))
          for item in data.get('items', []):
              title='[AUTO-REPAIR] '+item.get('area','unknown')+': '+item.get('summary','test failure')
              body='''Automated repair request.\n\nArea: {area}\nTechnician: {tech}\nTested SHA: {sha}\n\nEvidence:\n```\n{evidence}\n```\n\nRules: fix the root cause; do not disable, weaken, skip, or delete the failing test. Re-run the affected test before requesting merge.'''.format(
                  area=item.get('area','unknown'), tech=item.get('technician','foreman'), sha=os.environ.get('GITHUB_SHA'), evidence=item.get('evidence',''))
              subprocess.run(['gh','issue','create','--repo',os.environ['GITHUB_REPOSITORY'],'--title',title,'--body',body], check=False)

      - name: Persist repair evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-repair-evidence-${{ github.run_id }}
          path: repair-evidence/

      # Do not execute or check out workflow_run head code in this privileged context.
      # Repair evidence is retained as an Actions artifact and issue body, not pushed from this job.
