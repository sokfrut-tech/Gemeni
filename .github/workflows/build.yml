name: Build Jarvis

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jarvis-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK and NDK r26b
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install pinned Sherpa-ONNX Android runtime
        run: bash scripts/setup_sherpa_onnx.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        id: build-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Security and native compatibility checks
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ! unzip -l "$APK" | grep -E '(^|/)(\.env|.*secret.*|.*keystore.*)$' || { echo 'secret-like file inside APK'; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" "lib/$abi/libsherpa-onnx-jni.so" | grep -q 'libsherpa-onnx-jni.so'
            unzip -l "$APK" "lib/$abi/libonnxruntime.so" | grep -q 'libonnxruntime.so'
            unzip -l "$APK" "lib/$abi/libjarvis_native.so" | grep -q 'libjarvis_native.so'
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Inspect APK manifest, services and native ABIs
        run: bash scripts/inspect_apk.sh app/build/outputs/apk/debug/app-debug.apk

      # GitHub-hosted Linux runners expose KVM; explicitly grant the runner user access.
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          id

      # Keep a clean boot snapshot between runs. The cache key is pinned to the
      # runner OS, API, ABI and image profile to avoid cross-image AVD restores.
      - name: Restore Android Emulator AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: jarvis-avd-ubuntu-24.04-api35-x86_64-default-v1

      - name: Create clean Android Emulator snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: echo "Clean API 35 AVD booted; snapshot will be cached."

      - name: Runtime smoke tests on Android emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p emulator-diagnostics
          adb devices -l > emulator-diagnostics/adb-devices.txt 2>&1 || true
          adb shell getprop sys.boot_completed > emulator-diagnostics/boot-completed.txt 2>&1 || true
          adb logcat -d -v threadtime > emulator-diagnostics/logcat.txt 2>&1 || true
          adb shell dumpsys activity > emulator-diagnostics/activity.txt 2>&1 || true
          adb shell dumpsys meminfo > emulator-diagnostics/meminfo.txt 2>&1 || true

      - name: Upload runtime test results and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-runtime-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            emulator-diagnostics/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always() && steps.build-apk.outcome == 'success'
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
