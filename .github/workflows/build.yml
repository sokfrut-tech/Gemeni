name: Build Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK and NDK r26b
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install pinned Sherpa-ONNX Android runtime
        run: bash scripts/setup_sherpa_onnx.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        id: build-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Security and native compatibility checks
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ! unzip -l "$APK" | grep -E '(^|/)(\.env|.*secret.*|.*keystore.*)$' || { echo 'secret-like file inside APK'; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" "lib/$abi/libsherpa-onnx-jni.so" | grep -q 'libsherpa-onnx-jni.so'
            unzip -l "$APK" "lib/$abi/libonnxruntime.so" | grep -q 'libonnxruntime.so'
            unzip -l "$APK" "lib/$abi/libjarvis_native.so" | grep -q 'libjarvis_native.so'
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Inspect APK manifest, services and native ABIs
        run: bash scripts/inspect_apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator and system image
        timeout-minutes: 25
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1)"
          AVDMANAGER="$(find "$ANDROID_HOME" -type f -name avdmanager -perm -111 | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "emulator" "system-images;android-35;google_apis;x86_64"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$AVDMANAGER" create avd -n test -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          { echo "::error::HOME=$HOME AVDHOME=${ANDROID_AVD_HOME:-unset}"; "$AVDMANAGER" list avd 2>&1 | head -20 | sed "s#^#::error::avdlist: #"; ls -la "$HOME/.android/avd" 2>&1 | sed "s#^#::error::ls: #"; } || true
          test -f "$HOME/.android/avd/test.ini" || { echo "::error::test.ini missing after create"; exit 1; }
      - name: Start emulator and wait for boot
        timeout-minutes: 20
        run: |
          set -uo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo "start HOME=$HOME"; ls -la "$HOME/.android/avd" || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 2 > "$RUNNER_TEMP/emu.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emu.pid"
          for i in $(seq 1 150); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/emu.pid")" 2>/dev/null; then echo "emulator process exited early"; exit 1; fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then echo "booted after $i checks"; exit 0; fi
            sleep 6
          done
          echo "boot timeout"; exit 1
      - name: Runtime smoke tests on Android emulator
        timeout-minutes: 30
        run: |
          set -o pipefail
          "$ANDROID_HOME/platform-tools/adb" logcat -c || true
          "$ANDROID_HOME/platform-tools/adb" logcat -v time > "$RUNNER_TEMP/logcat.txt" 2>&1 &
          gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"
      - name: Diagnose emulator failure (annotations)
        if: failure()
        shell: bash
        run: |
          set +e
          echo "::error::logcat lines: $(wc -l < "$RUNNER_TEMP/logcat.txt" 2>/dev/null)"
          grep -E " [EF]/" "$RUNNER_TEMP/logcat.txt" 2>/dev/null | grep -iE "jarvis|instrument|uiautomation|died|crash|Process|FATAL|AndroidRuntime" | grep -v "Sending oneway" | head -n 40 | cut -c1-230 | sed "s#^#::error::jv: #"
          grep -n -A 14 "FAILED" "$RUNNER_TEMP/gradle-test.log" 2>/dev/null | head -n 40 | cut -c1-240 | sed "s#^#::error::fail: #"
          grep -E "am_crash|am_proc_died|am_kill|am_anr|has died|Process .*crash|Instrumentation|InstrumentationTestRunner|AndroidJUnitRunner|JarvisRuntimeSmokeTest|assistant\.test|FATAL|ANR in|killed|Killing|lowmem|Fatal signal" "$RUNNER_TEMP/logcat.txt" 2>/dev/null | tail -n 40 | cut -c1-240 | sed "s#^#::error::crash: #"
          tail -n 45 "$RUNNER_TEMP/emu.log" 2>/dev/null | cut -c1-220 | sed "s#^#::error::emuTail: #"
          grep -iE "what went wrong|FAILED|Exception|Caused by|error:|INSTRUMENTATION|No connected|tests completed|failed" "$RUNNER_TEMP/gradle-test.log" 2>/dev/null | head -n 25 | cut -c1-260 | sed "s#^#::error::gradle: #"
          grep -iE "fatal|crash|abort|panic|error|fail|kvm|gpu|boot" "$RUNNER_TEMP/emu.log" 2>/dev/null | tail -n 25 | cut -c1-220 | sed 's#^#::error::emu: #'
          adb devices 2>/dev/null | sed 's#^#::error::devices: #'
          adb logcat -d 2>/dev/null | grep -E "FATAL|AndroidRuntime|Process .* has died|Caused by|Exception" | grep -v "kotlin" | tail -n 30 | cut -c1-260 | sed "s#^#::error::crash: #"
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo "::error::adb devices: $($ADB devices -l 2>&1 | tr '\n' ' ' | cut -c1-900)"
          echo "::error::kvm: $(ls -l /dev/kvm 2>&1 | head -1)"
          for f in $(find "$HOME/.android" "/tmp" -maxdepth 4 -name '*.log' -newer /etc/hostname 2>/dev/null | head -5); do
            tail -n 15 "$f" | tr '\n' ' ' | cut -c1-900 | sed "s#^#::error::log $f: #"; echo
          done
          for x in $(find app/build/outputs -name '*.xml' 2>/dev/null | head -5); do
            grep -o '<failure[^>]*>' "$x" | head -2 | cut -c1-400 | sed "s#^#::error::test $x: #"
          done
          exit 0

      - name: Upload runtime test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-runtime-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.build-apk.outcome == 'success'
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
