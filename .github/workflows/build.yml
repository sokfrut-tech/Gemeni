name: Build Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK and NDK r26b
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install pinned Sherpa-ONNX Android runtime
        run: bash scripts/setup_sherpa_onnx.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Security and native compatibility checks
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ! unzip -l "$APK" | grep -E '(^|/)(\.env|.*secret.*|.*keystore.*)$' || { echo 'secret-like file inside APK'; exit 1; }
          unzip -l "$APK" | grep -q 'libsherpa-onnx-jni.so'
          unzip -l "$APK" | grep -q 'libonnxruntime.so'
          # zipalign -P 16 validates APK alignment suitable for 16 KiB-page devices.
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Inspect APK manifest, services and native ABIs
        run: bash scripts/inspect_apk.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
