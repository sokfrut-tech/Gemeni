name: Build Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - name: Install SDK and NDK r26b
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install pinned Sherpa-ONNX Android runtime
        run: bash scripts/setup_sherpa_onnx.sh
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        id: build-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Security and native compatibility checks
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ! unzip -l "$APK" | grep -E '(^|/)(\.env|.*secret.*|.*keystore.*)$' || { echo 'secret-like file inside APK'; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$APK" "lib/$abi/libsherpa-onnx-jni.so" | grep -q 'libsherpa-onnx-jni.so'
            unzip -l "$APK" "lib/$abi/libonnxruntime.so" | grep -q 'libonnxruntime.so'
            unzip -l "$APK" "lib/$abi/libjarvis_native.so" | grep -q 'libjarvis_native.so'
          done
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Inspect APK manifest, services and native ABIs
        run: bash scripts/inspect_apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Runtime smoke tests on Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          # Omit profile so avdmanager uses the runner's default hardware profile.
          target: default
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-boot-anim
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload runtime test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-runtime-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.build-apk.outcome == 'success'
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
