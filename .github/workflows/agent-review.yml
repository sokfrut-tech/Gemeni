name: Jarvis Agent Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/agent_swarm/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  deterministic-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic agent swarm
        run: python3 tools/agent_swarm/run_swarm.py --repo . --out build/agent-review
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-review
          path: build/agent-review

  llm-review:
    runs-on: ubuntu-24.04
    env:
      JARVIS_LLM_BASE_URL: https://openrouter.ai/api/v1
      JARVIS_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JARVIS_LLM_MODEL: ${{ vars.JARVIS_LLM_MODEL || 'qwen/qwen3.5-35b-a3b:free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check LLM configuration
        env:
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          if [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::Missing OPENROUTER_API_KEY. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            echo "Secret values are never printed."
            exit 1
          fi
          echo "OpenRouter endpoint is configured; API key secret is present."
      - name: Run model-backed independent reviewers
        run: python3 tools/agent_swarm/run_swarm.py --repo . --out build/agent-review-llm --llm
      - name: Classify model-review availability
        id: model-status
        if: always()
        run: |
          mkdir -p build/agent-review-llm
          STATE=degraded
          if [ -f build/agent-review-llm/reviews.json ]; then
            STATE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/agent-review-llm/reviews.json')
          data=json.loads(p.read_text())
          values=list(data.values()) if isinstance(data,dict) else data
          good=[v for v in values if isinstance(v,str) and not v.startswith('LLM unavailable:') and 'error' not in v.lower()]
          print('available' if good else 'degraded')
          PY
          )
          fi
          printf 'state=%s\n' "$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = available ]; then
            echo 'AVAILABLE: at least one model-backed reviewer returned a result.' > build/agent-review-llm/MODEL_REVIEW_STATUS.md
          else
            echo 'DEGRADED: model-backed reviewers did not return usable results. Inspect reviews.json. Deterministic review is separate and does not count as an LLM review.' > build/agent-review-llm/MODEL_REVIEW_STATUS.md
          fi
      - name: Upload model reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-review-llm
          path: build/agent-review-llm
