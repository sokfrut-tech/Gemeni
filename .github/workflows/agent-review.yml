name: Jarvis Agent Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/agent_swarm/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  deterministic-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic agent swarm
        run: python3 tools/agent_swarm/run_swarm.py --repo . --out build/agent-review
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-review
          path: build/agent-review

  llm-review:
    runs-on: ubuntu-24.04
    env:
      JARVIS_LLM_BASE_URL: ${{ secrets.Qwen_URL }}
      JARVIS_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JARVIS_LLM_MODEL: ${{ vars.JARVIS_LLM_MODEL || 'qwen/qwen3.5-35b-a3b:free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check LLM configuration
        env:
          HAS_BASE_URL: ${{ secrets.Qwen_URL != '' }}
          HAS_API_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          if [ "$HAS_BASE_URL" != "true" ] || [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::Missing GitHub Actions repository secrets. Configure Qwen_URL and OPENROUTER_API_KEY in Settings > Secrets and variables > Actions > Repository secrets."
            echo "Secret values are never printed."
            exit 1
          fi
          echo "LLM endpoint and API key are configured."
      - name: Run model-backed independent reviewers
        run: python3 tools/agent_swarm/run_swarm.py --repo . --out build/agent-review-llm --llm
      - name: Upload model reviews
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-agent-review-llm
          path: build/agent-review-llm
