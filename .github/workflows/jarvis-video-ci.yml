name: Jarvis Video CI

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/jarvis/breeno/assistant/video/**'
      - 'app/src/test/java/com/jarvis/breeno/assistant/video/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/jarvis-video-ci.yml'
      - 'scripts/setup_sherpa_onnx.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-video-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  video-build-and-unit-tests:
    name: Video compile, APK and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and pinned NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install pinned Sherpa-ONNX Android runtime
        run: bash scripts/setup_sherpa_onnx.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run video trim unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build complete debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK archive
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-video-ci-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
