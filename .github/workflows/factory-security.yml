name: Factory Security Baseline

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: factory-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android build components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.31.6"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Kotlin sources for CodeQL
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unit-test-results-${{ github.sha }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Build full debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and hash debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          upload: false
      - name: Stage CodeQL SARIF results
        if: success()
        run: |
          mkdir -p codeql-artifacts
          cp ../results/*.sarif codeql-artifacts/
      - name: Archive CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-artifacts/*.sarif
          if-no-files-found: warn

  emulator-smoke:
    name: Android emulator smoke tests
    runs-on: ubuntu-latest
    needs: [codeql]
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android emulator smoke tests
        timeout-minutes: 32
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            set +e
            # The emulator-runner action has already booted the AVD and waited for ADB.
            # Clear old logs, then capture the live emulator before action cleanup.
            adb logcat -c >/dev/null 2>&1 || true
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_status=$?
            mkdir -p emulator-diagnostics
            if [ -d app/build/reports/androidTests/connected ]; then cp -R app/build/reports/androidTests/connected emulator-diagnostics/test-reports; fi
            if [ -d app/build/outputs/androidTest-results/connected ]; then cp -R app/build/outputs/androidTest-results/connected emulator-diagnostics/test-results; fi
            if [ -d app/build/outputs/androidTest-results ]; then cp -R app/build/outputs/androidTest-results emulator-diagnostics/all-test-results; fi
            if [ "$test_status" -eq 0 ]; then
              python3 - <<'PY' || test_status=$?
            import glob
            import sys
            import xml.etree.ElementTree as ET

            paths = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
            if not paths:
                print("ERROR: no Android instrumentation XML reports were produced")
                sys.exit(1)
            total = 0
            for path in paths:
                root = ET.parse(path).getroot()
                total += int(root.attrib.get("tests", "0"))
            print(f"Android instrumentation executed tests: {total}")
            if total < 1:
                print("ERROR: instrumentation reported zero executed tests")
                sys.exit(1)
            PY
            fi
            if [ "$test_status" -ne 0 ]; then
              adb devices -l > emulator-diagnostics/devices.txt 2>&1 || true
              timeout 12s adb shell getprop > emulator-diagnostics/getprop.txt 2>&1 || true
              timeout 12s adb shell dumpsys package com.jarvis.breeno.assistant > emulator-diagnostics/app-package.txt 2>&1 || true
              timeout 12s adb shell dumpsys activity processes > emulator-diagnostics/activity-processes.txt 2>&1 || true
              timeout 20s adb logcat -d -v threadtime > emulator-diagnostics/logcat.txt 2>&1 || true
            fi
            exit "$test_status"
      - name: Capture bounded emulator diagnostics on failure
        if: failure()
        timeout-minutes: 4
        shell: bash
        run: |
          # The primary diagnostics are captured inside the emulator-runner action,
          # before its cleanup shuts down the AVD. This is only a bounded fallback
          # for failures that occur before the script starts.
          if [ ! -d emulator-diagnostics ]; then
            mkdir -p emulator-diagnostics
            adb devices -l > emulator-diagnostics/devices.txt 2>&1 || true
            timeout 12s adb shell getprop > emulator-diagnostics/getprop.txt 2>&1 || true
            timeout 12s adb shell dumpsys package com.jarvis.breeno.assistant > emulator-diagnostics/app-package.txt 2>&1 || true
            timeout 12s adb shell dumpsys activity processes > emulator-diagnostics/activity-processes.txt 2>&1 || true
            timeout 20s adb logcat -d -v threadtime > emulator-diagnostics/logcat.txt 2>&1 || true
            if [ -d app/build/reports/androidTests/connected ]; then cp -R app/build/reports/androidTests/connected emulator-diagnostics/test-reports; fi
            if [ -d app/build/outputs/androidTest-results/connected ]; then cp -R app/build/outputs/androidTest-results/connected emulator-diagnostics/test-results; fi
            if [ -d app/build/outputs/androidTest-results ]; then cp -R app/build/outputs/androidTest-results emulator-diagnostics/all-test-results; fi
          fi
      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-emulator-evidence-${{ github.sha }}
          path: emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 14
