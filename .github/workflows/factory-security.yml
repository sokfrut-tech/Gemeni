name: Factory Security Baseline

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: factory-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - name: Install Android build components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.31.6"
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Kotlin sources for CodeQL
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Build full debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and hash debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:java-kotlin
          upload: false
      - name: Stage CodeQL SARIF results
        if: success()
        run: |
          mkdir -p codeql-artifacts
          cp ../results/*.sarif codeql-artifacts/
      - name: Archive CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-artifacts/*.sarif
          if-no-files-found: warn

  factory-toolchain:
    name: Factory shared static toolchain
    uses: sokfrut-tech/Universal-AI-Factory/.github/workflows/factory-security-reusable.yml@50678f1d19c7cdf477e1dbc64bad893b1389eca4
    permissions:
      contents: read
